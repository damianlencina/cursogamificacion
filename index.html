/* ============================================================
   ESTADO + PERSISTENCIA
   ============================================================ */
const PREFIX="coto-gam", PROFILE_KEY=PREFIX+":profile", THEME_KEY=PREFIX+":theme";
const TOTAL=COURSE.days.length;
const state={name:"",completed:new Set()};

const slug=s=>(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"default";
const progressKey=()=>PREFIX+":progress:"+slug(state.name);

function loadProfile(){ try{state.name=localStorage.getItem(PROFILE_KEY)||"";}catch(e){state.name="";} }
function loadProgress(){ try{const r=localStorage.getItem(progressKey());state.completed=new Set(r?JSON.parse(r):[]);}catch(e){state.completed=new Set();} }
function saveProgress(){ try{localStorage.setItem(progressKey(),JSON.stringify([...state.completed]));}catch(e){} }
function setName(n){ state.name=n.trim(); try{localStorage.setItem(PROFILE_KEY,state.name);}catch(e){} loadProgress(); loadQuiz(); loadSections(); }

/* Quiz state: aprobado o no por día, por usuario */
const quizKey=()=>PREFIX+":quiz:"+slug(state.name);
const quizState={passed:new Set()};
function loadQuiz(){ try{const r=localStorage.getItem(quizKey());quizState.passed=new Set(r?JSON.parse(r):[]);}catch(e){quizState.passed=new Set();} }
function saveQuiz(){ try{localStorage.setItem(quizKey(),JSON.stringify([...quizState.passed]));}catch(e){} }
function quizPassed(n){ return quizState.passed.has(n); }
function markQuizPassed(n){ quizState.passed.add(n); saveQuiz(); }

const isDone=n=>state.completed.has(n);
const isUnlocked=n=>n===1||state.completed.has(n-1);
const doneCount=()=>state.completed.size;
const pad=n=>String(n).padStart(2,"0");
const weekOf=n=>COURSE.weeks.find(w=>n>=w.range[0]&&n<=w.range[1]);
function nextDay(){ for(let i=1;i<=TOTAL;i++) if(isUnlocked(i)&&!isDone(i)) return i; return TOTAL; }

/* ============================================================
   ELEMENTOS GLOBALES
   ============================================================ */
const app=document.getElementById("app");
const tbCount=document.getElementById("tbCount");
const tbFill=document.getElementById("tbFill");
const tbName=document.getElementById("tbName");

function updateTopbar(){
  tbCount.textContent=doneCount()+"/"+TOTAL;
  tbFill.style.width=Math.round(doneCount()/TOTAL*100)+"%";
  if(!state.name){ tbName.textContent=""; return; }
  let text="Hola, "+state.name;
  const m=location.hash.match(/^#dia-(\d+)$/);
  if(m){
    const n=parseInt(m[1],10), d=COURSE.days[n-1];
    if(d && d.format==='v2' && d.sections){
      const visible=visibleSectionCount(n,d.sections.length);
      const activeIdx=Math.min(visible-1,d.sections.length-1);
      text=state.name+" · Sec "+(activeIdx+1)+" de "+d.sections.length;
    }
  }
  tbName.textContent=text;
}

function countUp(el,target,dur=1100){
  const start=performance.now();
  (function tick(now){
    const p=Math.min(1,(now-start)/dur), e=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*e);
    if(p<1)requestAnimationFrame(tick); else el.textContent=target;
  })(performance.now());
}

function statusBadge(n){
  if(isDone(n)) return '<span class="badge badge-done">✓ Completado</span>';
  if(isUnlocked(n)) return '<span class="badge badge-open">Disponible</span>';
  return '<span class="badge badge-lock">Bloqueado</span>';
}

function totalInsights(){
  let n=0;
  COURSE.days.forEach(d=>{
    if(d.sections) d.sections.forEach((s,i)=>{ if(s.insight && isSectionDone(d.n,i)) n++; });
  });
  return n;
}
function maxInsights(){
  let n=0;
  COURSE.days.forEach(d=>{ if(d.sections) d.sections.forEach(s=>{ if(s.insight) n++; }); });
  return n;
}

function dayCard(d, nextN){
  const done=isDone(d.n), unlocked=isUnlocked(d.n), isNext=(d.n===nextN && !done);
  const accent=weekOf(d.n).accent;
  const cls=["day-card",done?"is-done":"",!unlocked?"is-locked":"",isNext?"is-next":""].filter(Boolean).join(" ");
  const medallion = done
    ? `<div class="day-index day-index-done" aria-hidden="true">✓</div>`
    : `<div class="day-index">${pad(d.n)}</div>`;
  const nextTag = isNext ? `<span class="day-next-tag">Continuá acá</span>` : "";
  const inner=`
    <div class="day-accent"></div>
    <div class="day-inner">
      ${medallion}
      <div class="day-main">
        <div class="day-cardhead">${nextTag}<h3>${d.title}</h3>${statusBadge(d.n)}</div>
        <p class="day-summary">${d.summary}</p>
        <p class="day-deliv"><span class="chip">Entregable</span> ${d.deliverable}</p>
      </div>
      <div class="day-arrow">→</div>
    </div>`;
  return unlocked
    ? `<a class="${cls}" style="--accent:${accent}" href="#dia-${d.n}">${inner}</a>`
    : `<div class="${cls}" style="--accent:${accent}" aria-disabled="true">${inner}</div>`;
}

function renderDay(n){
  const d=COURSE.days[n-1];
  if(d.format==="v2") return renderDayV2(n);
  return renderDayLegacy(n);
}

  const passed=hasQuiz?quizPassed(n):true;

    completeBtn='<span class="btn btn-done">✓ Día completado</span>';

    completeBtn=`<button class="btn btn-primary" disabled title="Aprobá el quiz de cierre para habilitar">Marcar como completado</button>`;

    completeBtn=`<button class="btn btn-primary" data-complete="${n}">Marcar como completado</button>`;

  if(n<TOTAL){
    nextBtn=done ? `<a class="btn btn-ghost" href="#dia-${n+1}">Día ${n+1} →</a>`
                 : `<button class="btn btn-ghost" disabled title="Completá este día para continuar">Día ${n+1} →</button>`;
  } else if(done){
    nextBtn=`<a class="btn btn-ghost" href="#" data-home>Volver al índice →</a>`;
  }

  app.innerHTML=`

/* ============================================================
   STATE: SECTIONS V2 (disclosure progresivo)
   ============================================================ */
const SECTIONS_KEY = PREFIX + ":sections:";
const sectionsState = {};
function sectionsKey(){ return SECTIONS_KEY + slug(state.name); }
function loadSections(){
  try{
    Object.keys(sectionsState).forEach(k=>delete sectionsState[k]);
    const r=localStorage.getItem(sectionsKey());
    const obj=r?JSON.parse(r):{};
    for(const k in obj) sectionsState[k]=new Set(obj[k]);
  }catch(e){}
}
function saveSections(){
  const obj={};
  for(const k in sectionsState) obj[k]=[...sectionsState[k]];
  try{localStorage.setItem(sectionsKey(),JSON.stringify(obj));}catch(e){}
}
function isSectionDone(dN,i){ return sectionsState[dN]?.has(i); }
function markSectionDone(dN,i){
  if(!sectionsState[dN]) sectionsState[dN]=new Set();
  sectionsState[dN].add(i);
  saveSections();
}
function visibleSectionCount(dN,total){
  let n=1;
  for(let i=0;i<total-1;i++){ if(isSectionDone(dN,i)) n++; else break; }
  return n;
}

/* ============================================================
   RENDER V2 — DÍA con disclosure progresivo
   ============================================================ */
function isOnboarded(n){ try{ return localStorage.getItem(PREFIX+":onboarded:"+slug(state.name)+":"+n)==='1'; }catch(e){ return false; } }
function markOnboarded(n){ try{ localStorage.setItem(PREFIX+":onboarded:"+slug(state.name)+":"+n,'1'); }catch(e){} }
function renderOnboarding(n){
  const avS=avatarMarkup('sofia',n), avP=avatarMarkup('pedro',n);
  const greet=state.name?`Hola, ${state.name}`:'Hola';
  return `
    <div class="onboarding-card" id="onboarding-card">
      <div class="onboarding-avatar-group" style="display:flex;flex:none">
        <div class="onboarding-avatar">${avS}</div>

        <p>Los insights que vas recolectando quedan en <strong>tu cuaderno</strong> (abajo a la derecha). Al cerrar el día, son el material para tu entregable.</p>

          <button class="btn btn-primary" data-onboard-dismiss>Arrancar el Día ${n} <span class="arr">→</span></button>

      </div>

    </div>`;

function renderDayV2(n){
  const d=COURSE.days[n-1], w=weekOf(n), done=isDone(n);
  const total=d.sections.length;
  const visible=visibleSectionCount(n,total);
  const hasQuiz=Array.isArray(d.quiz)&&d.quiz.length>0;
  const passed=hasQuiz?quizPassed(n):true;
  const allDone=visible===total && passed;
  const onboardingHTML = isOnboarded(n) ? '' : renderOnboarding(n);

  const stepperHTML=d.sections.map((s,i)=>{
    let cls="step";
    if(isSectionDone(n,i)) cls+=" done";
    else if(i<visible) cls+=" active";
    else cls+=" locked";
    const stepBtn=`<button class="${cls}" data-step="${i}" ${i>=visible?'disabled':''}><span class="step-n"><span class="num">${i+1}</span></span><span class="step-title">${s.title}</span></button>`;
    const divider=i<total-1 ? `<span class="step-divider ${isSectionDone(n,i)?'done':''}"></span>` : '';
    return stepBtn+divider;
  }).join("");

  const sectionsHTML=d.sections.slice(0,visible).map((s,i)=>renderSectionV2(s,i,n,total)).join("");

  let completeBtn;
  if(done){
    completeBtn='<span class="btn btn-done">✓ Día completado</span>';
  } else if(!allDone){
    const reason=hasQuiz&&!passed&&visible===total ? "Aprobá el quiz de la sección 5" : "Completá todas las secciones";
    completeBtn=`<button class="btn btn-primary" disabled title="${reason}">Marcar como completado</button>`;
  } else {
    completeBtn=`<button class="btn btn-primary" data-complete="${n}">Marcar como completado</button>`;
  }
  const prevBtn=n>1 ? `<a class="btn-link" href="#dia-${n-1}">← Día ${n-1}</a>` : `<a class="btn-link" href="#" data-home>← Índice</a>`;
  let nextBtn="";
  if(n<TOTAL){
    nextBtn=done ? `<a class="btn btn-ghost" href="#dia-${n+1}">Día ${n+1} →</a>`
                 : `<button class="btn btn-ghost" disabled title="Completá este día para continuar">Día ${n+1} →</button>`;
  } else if(done){
    nextBtn=`<a class="btn btn-ghost" href="#" data-home>Volver al índice →</a>`;
  }

  app.innerHTML=`
    <div class="view">
      <div class="day-wrap">
        <a class="back" href="#" data-home>← Índice del programa</a>
        <header class="day-header">
          <p class="eyebrow">Semana ${w.n} · Día ${n} de ${TOTAL}</p>
          <h1 class="day-title">${d.title}</h1>
          <div class="day-meta">
            <span>⏱ ${d.duration}</span><span class="dot"></span><span>${w.title}</span>
          </div>
        </header>
        ${onboardingHTML}
        <nav class="day-stepper" id="dayStepper" aria-label="Progreso del día">${stepperHTML}</nav>
        ${sectionsHTML}
        <nav class="daynav">
          ${prevBtn}<span class="spacer"></span>${completeBtn}${nextBtn}
        </nav>
      </div>
    </div>`;

  const cb=app.querySelector("[data-complete]");
  if(cb) cb.addEventListener("click",()=>{ state.completed.add(n); saveProgress(); updateTopbar(); renderDay(n); showDayCelebration(n); });

  app.querySelectorAll('[data-onboard-dismiss]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      markOnboarded(n);
      const card=document.getElementById('onboarding-card');
      if(card){ card.style.transition='opacity .25s,transform .25s'; card.style.opacity='0'; card.style.transform='translateY(-8px)'; setTimeout(()=>card.remove(),260); }
    });
  });

  app.querySelectorAll('.step.done').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=parseInt(btn.dataset.step,10);
      const sec=app.querySelector(`#sec-${i}`);
      if(sec) sec.scrollIntoView({behavior:'smooth',block:'start'});
    });
  });

  initInteractivesV2(n);

  document.getElementById('cuadernoFab').classList.add('visible');
  updateCuaderno(n);
}

/* PNG → SVG fallback para los avatares (Sofía / Pedro) */
let SOFIA_PNG_OK = false, PEDRO_PNG_OK = false;
(function checkAvatarPngs(){
  [['sofia',v=>{SOFIA_PNG_OK=v;}],['pedro',v=>{PEDRO_PNG_OK=v;}]].forEach(([who,set])=>{
    const img = new Image();
    img.addEventListener('load', () => {
      set(true);
      const n = parseHash && parseHash();
      if(n && typeof renderDay==='function') renderDay(n);
    });
    img.src = 'assets/'+who+'.png';
  });
})();
function avatarMarkup(who, dayN){
  who = (who==='pedro') ? 'pedro' : 'sofia';
  const ok = (who==='pedro') ? PEDRO_PNG_OK : SOFIA_PNG_OK;
  const alt = (who==='pedro') ? 'Pedro' : 'Sofía';
  if(ok) return `<img src="assets/${who}.png" alt="${alt}">`;
  return `<svg viewBox="0 0 100 100"><use href="#${who}-avatar"/>${SOFIA_MOOD[moodForDay(dayN)]}</svg>`;
}

  return `

  return `<div class="interactive" data-interactive="${int.type}" data-int-section="${secIdx}">${head}${body}</div>`;
}

function initInteractivesV2(dayN){
  const d=COURSE.days[dayN-1];

  for(let i=0;i<visible;i++){

    else if(type==='mda') initMdaV2(block,dayN,i,alreadyDone);
    else if(type==='fourCheck') initFourCheckV2(block,dayN,i,alreadyDone);
    else if(type==='scenario') initScenarioV2(block,dayN,i,sec.interactive.scenario,alreadyDone);
    else if(type==='familyCards') initFamilyCardsV2(block,dayN,i,sec.interactive.families,alreadyDone);
    else if(type==='bartle') initBartleV2(block,dayN,i,alreadyDone);
    else if(type==='retailPrinciples') initRetailV2(block,dayN,i,alreadyDone);
    else if(type==='toolPicker') initToolPickerV2(block,dayN,i,sec.interactive.checks,alreadyDone);
    else if(type==='gameAnalyzer') initGameAnalyzerV2(block,dayN,i,sec.interactive.games,alreadyDone);
    else if(type==='gapMap') initGapMapV2(block,dayN,i,sec.interactive,alreadyDone);
    else if(type==='decisionTree') initDecisionTreeV2(block,dayN,i,sec.interactive.tree,alreadyDone);

    else if(type==='difficultyRamp') initDifficultyRampV2(block,dayN,i,sec.interactive.phases,alreadyDone);

function showSectionExtras(dayN,secIdx,performance){
  const section=app.querySelector(`.section[data-section="${secIdx}"]`);
  if(!section) return;
  sfx.sectionUnlock();
  const btn=section.querySelector('.section-next');
  if(btn){
    btn.disabled=false;
    const hint=section.querySelector('.section-next-hint');
    if(hint) hint.remove();
  }
  const sec=COURSE.days[dayN-1].sections[secIdx];
  const who = (sec.sofia && sec.sofia.who) || 'sofia';
  const av = avatarMarkup(who, dayN);
  if(sec.feedback && !section.querySelector('.sofia-reflect')){
    let text=sec.feedback.default || sec.feedback.passed || '';
    if(performance && sec.feedback[performance]) text=sec.feedback[performance];
    const fb=document.createElement('div');
    fb.className='sofia-reflect';
    fb.innerHTML=`<div class="sofia-mini">${av}</div><p>${text}</p><button class="audio-btn" data-audio data-audio-src="assets/audio/${who}-d${dayN}-s${secIdx+1}-reflect.mp3" aria-label="Escuchar a ${who==='pedro'?'Pedro':'Sofía'}" type="button"></button>`;
    const interactive=section.querySelector('.interactive');
    interactive.after(fb);
  }
  if(sec.idea && !section.querySelector('.lead-key')){
    const c=document.createElement('p');
    c.className='lead-key';
    c.innerHTML=`<span class="lead-key-tag">${sec.idea.tag}</span>${sec.idea.text}`;
    const ref=section.querySelector('.sofia-reflect') || section.querySelector('.interactive');
    ref.after(c);
  }
}

function initDndV2(block,dayN,secIdx,items,alreadyDone){
  const pool=block.querySelector('.dnd-pool-v2');
  const zones=block.querySelectorAll('.dnd-zone-v2');
  const feedback=block.querySelector('.dnd-feedback-v2');
  const shuffled=[...items].sort(()=>Math.random()-0.5);
  shuffled.forEach(item=>{
    const el=document.createElement('div');
    el.className='dnd-item-v2';
    el.draggable=true;
    el.dataset.id=item.id;
    el.dataset.cat=item.cat;
    el.textContent=item.text;
    pool.appendChild(el);
  });
  let dragged=null, firstTry=true, completed=alreadyDone;
  const allItems=block.querySelectorAll('.dnd-item-v2');
  allItems.forEach(it=>{
    it.addEventListener('dragstart',e=>{
      dragged=it; it.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',it.dataset.id);
    });
    it.addEventListener('dragend',()=>{ it.classList.remove('dragging'); dragged=null; });
    let touchClone=null, offX=0, offY=0;
    it.addEventListener('touchstart',e=>{
      const t=e.touches[0], r=it.getBoundingClientRect();
      offX=t.clientX-r.left; offY=t.clientY-r.top;
      dragged=it; it.classList.add('dragging');
    },{passive:true});
    it.addEventListener('touchmove',e=>{
      if(!dragged) return; e.preventDefault();
      const t=e.touches[0];
      if(!touchClone){
        touchClone=it.cloneNode(true);
        touchClone.style.position='fixed';
        touchClone.style.zIndex='9999';
        touchClone.style.pointerEvents='none';
        touchClone.style.width=it.offsetWidth+'px';
        touchClone.style.opacity='.85';
        document.body.appendChild(touchClone);
      }
      touchClone.style.left=(t.clientX-offX)+'px';
      touchClone.style.top=(t.clientY-offY)+'px';
      zones.forEach(z=>z.classList.remove('dragover'));
      const el=document.elementFromPoint(t.clientX,t.clientY);
      const z=el?el.closest('.dnd-zone-v2'):null;
      if(z) z.classList.add('dragover');
    },{passive:false});
    it.addEventListener('touchend',e=>{
      if(!dragged) return;
      const t=e.changedTouches[0];
      const el=document.elementFromPoint(t.clientX,t.clientY);
      const z=el?el.closest('.dnd-zone-v2'):null;
      zones.forEach(zn=>zn.classList.remove('dragover'));
      if(touchClone){ touchClone.remove(); touchClone=null; }
      it.classList.remove('dragging');
      if(z) drop(it,z);
      dragged=null;
    });
  });
  zones.forEach(z=>{
    z.addEventListener('dragover',e=>{ e.preventDefault(); z.classList.add('dragover'); });
    z.addEventListener('dragleave',()=>z.classList.remove('dragover'));
    z.addEventListener('drop',e=>{
      e.preventDefault(); z.classList.remove('dragover');
      if(!dragged) return;
      drop(dragged,z);
    });
  });
  function drop(item,zone){
    const correct=item.dataset.cat===zone.dataset.zone;
    if(correct){
      item.classList.remove('incorrect');
      item.classList.add('correct');
      item.draggable=false;
      zone.appendChild(item);
      sfx.dropCorrect();
    } else {
      item.classList.add('incorrect');
      firstTry=false;
      sfx.dropIncorrect();
      setTimeout(()=>item.classList.remove('incorrect'),600);
    }
    update();
  }
  function update(){
    const correct=block.querySelectorAll('.dnd-item-v2.correct').length;
    if(correct===items.length){
      feedback.textContent='¡Listo! Los seis están bien clasificados.';
      feedback.classList.add('done');
      if(!completed){
        completed=true;
        const perf = firstTry ? 'allCorrect' : 'mixed';
        showSectionExtras(dayN,secIdx,perf);
      }
    } else {
      feedback.textContent=`Llevás ${correct} de ${items.length} bien clasificados.`;
    }
  }
}

function initToolPickerV2(block,dayN,secIdx,checks,alreadyDone){
  const items=block.querySelectorAll('.tool-check');
  const score=block.querySelector('.tool-score');
  const result=block.querySelector('.tool-result');
  let completed=alreadyDone;
  let interactions=0;
  function update(){
    let htmlScore=0, totalChecked=0;
    items.forEach((it,i)=>{
      const checked=it.querySelector('input').checked;
      it.classList.toggle('checked',checked);
      if(checked){ totalChecked++; htmlScore+=parseInt(it.dataset.weight,10)||0; }
    });
    if(totalChecked===0){ score.textContent=''; result.classList.remove('shown'); return; }
    score.innerHTML=`Características marcadas: <strong>${totalChecked}</strong> · Puntaje de complejidad: <strong>${htmlScore}</strong>`;
    let cls, msg;
    if(htmlScore>=3){
      cls='html';
      msg=`<span class="tool-result-tag">HTML</span><strong>Conviene HTML con Claude.</strong> La mecánica que pensaste tiene lógica conectada, narrativa con estados o animaciones específicas. Storyline va a quedar corto o se va a volver inmantenible.`;
    } else if(htmlScore>=2){
      cls='html';
      msg=`<span class="tool-result-tag">HTML</span><strong>Storyline puede, pero HTML te da más respiro.</strong> Hay 2+ características de complejidad. Si tenés el tiempo y querés algo robusto, HTML.`;
    } else {
      cls='storyline';
      msg=`<span class="tool-result-tag">Storyline</span><strong>Storyline alcanza.</strong> Tu mecánica entra en lo que Storyline maneja bien: quizzes, capas, variables simples, ramificaciones cortas. No hay razón para complicarlo con HTML.`;
    }
    result.className='tool-result shown '+cls;
    result.innerHTML=msg;
  }
  items.forEach(it=>{
    it.addEventListener('click',e=>{
      const inp=it.querySelector('input');
      if(e.target!==inp) inp.checked=!inp.checked;
      interactions++;
      update();
      if(interactions>=2 && !completed){ completed=true; showSectionExtras(dayN,secIdx,'default'); }
    });
  });
}

function initDecisionTreeV2(block,dayN,secIdx,tree,alreadyDone){
  const root=block.querySelector('.dtree');
  let completed=alreadyDone, depth=0;
  function renderNode(id){
    const node=tree.nodes[id];
    depth++;
    root.innerHTML=`
      <p class="dtree-progress">Pregunta ${depth}</p>
      <p class="dtree-q">${node.q}</p>
      <div class="dtree-options">${node.options.map((o,i)=>`<button class="dtree-opt" data-opt="${i}" type="button">${o.text}</button>`).join("")}</div>`;
    root.querySelectorAll('.dtree-opt').forEach((btn,i)=>{
      btn.addEventListener('click',()=>{
        const go=node.options[i].go;
        if(go.startsWith('v_')) renderVerdict(go);
        else renderNode(go);
      });
    });
  }
  function renderVerdict(vid){
    const v=tree.verdicts[vid];
    const tagText=v.type==='si'?'Sí, gamificá':v.type==='no'?'No gamifiques':'Gamificá liviano';
    root.innerHTML=`
      <div class="dtree-verdict ${v.type}">
        <span class="dtree-verdict-tag">${tagText}</span>
        <p class="dtree-verdict-title">${v.title}</p>
        <p class="dtree-verdict-text">${v.text}</p>
        <button class="dtree-reset" type="button">↻ Probar con otro contenido</button>
      </div>`;
    root.querySelector('.dtree-reset').addEventListener('click',()=>{ depth=0; renderNode(tree.start); });
    if(!completed){ completed=true; showSectionExtras(dayN,secIdx,'default'); }
  }
  renderNode(tree.start);
}

function initScenarioV2(block,dayN,secIdx,scenario,alreadyDone){
  const stage=block.querySelector('[data-stage]');
  if(!stage) return;
  let completed=alreadyDone;
  let firstChoiceGood=null;

  function renderStep(stepId){
    const step=scenario.steps.find(s=>s.id===stepId);
    if(!step){ showDebrief(); return; }
    stage.innerHTML=`
      <p class="scenario-prompt">${step.prompt}</p>
      <div class="scenario-options">
        ${step.options.map((o,i)=>`<button class="scenario-opt" data-opt="${i}" type="button">${o.text}</button>`).join("")}
      </div>
      <div class="scenario-result"></div>
    `;
    stage.querySelectorAll('.scenario-opt').forEach((b,i)=>{
      b.addEventListener('click',()=>{
        const opt=step.options[i];
        if(firstChoiceGood===null && step.id==='start') firstChoiceGood = opt.next==='good';
        stage.querySelectorAll('.scenario-opt').forEach(x=>{ x.disabled=true; x.classList.add('scenario-opt-done'); });
        b.classList.add('scenario-opt-chosen');
        const result=stage.querySelector('.scenario-result');
        result.innerHTML=`<p class="scenario-feedback">${opt.feedback}</p>
          <button class="btn btn-primary scenario-next" type="button">${opt.next==='debrief'?'Ver el debrief →':'Continuar →'}</button>`;
        result.querySelector('.scenario-next').addEventListener('click',()=>{
          if(opt.next==='debrief'){ showDebrief(); }
          else { renderStep(opt.next); }
        });
      });
    });
  }

  function showDebrief(){
    const debriefHTML=scenario.debrief.map(d=>`
      <div class="debrief-item">
        <p class="debrief-tag">${d.tag}</p>
        <p>${d.text}</p>
      </div>`).join("");
    stage.innerHTML=`
      <div class="scenario-debrief">
        <p class="debrief-title">Lo que acabás de vivir como diseñador del aprendizaje:</p>
        ${debriefHTML}
        <button class="btn btn-ghost scenario-reset" type="button">↻ Probar otra ruta</button>
      </div>`;
    stage.querySelector('.scenario-reset').addEventListener('click',()=>{
      firstChoiceGood=null;
      renderStep('start');
    });
    if(!completed){
      completed=true;
      const perf = firstChoiceGood ? 'efficient' : (firstChoiceGood===false ? 'rough' : 'default');
      showSectionExtras(dayN,secIdx,perf);
    }
  }

  renderStep('start');
}

function initQuizV2(dayN, questions, secIdx){
  const container=app.querySelector('#quiz-d1');
  if(!container) return;
  const submitBtn=app.querySelector('#quiz-submit');
  const retryBtn=app.querySelector('#quiz-retry');
  const result=app.querySelector('#quiz-result');
  const gate=app.querySelector('#quiz-gate');
  const passedAlready=quizPassed(dayN);
  let retryCount=0;

  container.innerHTML=questions.map((q,i)=>`
    <div class="quiz-q" data-q="${i}">
      <p class="quiz-q-text"><span class="quiz-q-num">${i+1}</span>${q.q}</p>
      <div class="quiz-options">
        ${q.opts.map((o,j)=>`<label class="quiz-opt" data-opt="${j}"><input type="radio" name="q${i}" value="${j}"><span>${o}</span></label>`).join("")}
      </div>
      <div class="quiz-feedback" id="qfb-${i}"></div>
    </div>
  `).join("");

  container.querySelectorAll('.quiz-opt').forEach(opt=>{
    opt.addEventListener('click',()=>{
      const q=opt.closest('.quiz-q');
      q.querySelectorAll('.quiz-opt').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
      sfx.quizSelect();
    });
  });

  function correctAll(){
    let score=0;
    questions.forEach((q,i)=>{
      const sel=container.querySelector(`input[name="q${i}"]:checked`);
      const opts=container.querySelectorAll(`.quiz-q[data-q="${i}"] .quiz-opt`);
      const fb=container.querySelector(`#qfb-${i}`);
      opts.forEach(o=>o.classList.add('disabled'));
      if(!sel){
        fb.textContent='Sin respuesta. La correcta es: «'+q.opts[q.correct]+'». '+q.explain;
        fb.className='quiz-feedback bad show';
        opts[q.correct].classList.add('correct');
        return;
      }
      const picked=parseInt(sel.value,10);
      if(picked===q.correct){
        score++;
        opts[picked].classList.add('correct');
        fb.textContent='Correcto. '+q.explain;
        fb.className='quiz-feedback ok show';
      } else {
        opts[picked].classList.add('incorrect');
        opts[q.correct].classList.add('correct');
        fb.textContent='La correcta es: «'+q.opts[q.correct]+'». '+q.explain;
        fb.className='quiz-feedback bad show';
      }
    });
    const pass=score>=3;
    if(pass) sfx.quizCorrect(); else sfx.quizIncorrect();
    result.textContent=`${score} / ${questions.length} respuestas correctas${pass?' — aprobado':''}`;
    result.className='quiz-result '+(pass?'pass':'fail');
    submitBtn.style.display='none';
    retryBtn.style.display='';
    if(pass){
      markQuizPassed(dayN);
      gate.innerHTML='<strong>¡Aprobado!</strong> Ya podés marcar el día como completado abajo.';
      gate.style.background='var(--green-soft)';
      gate.style.borderColor='var(--green)';
      markSectionDone(dayN,secIdx);
      let perf='passed';
      if(retryCount===0 && score===questions.length) perf='perfect';
      else if(retryCount===0) perf='passedFirst';
      else perf='passedRetry';
      showSectionExtras(dayN,secIdx,perf);
      setTimeout(()=>{ renderDay(dayN); updateTopbar(); updateCuaderno(dayN); },800);
    }
  }

  if(passedAlready){
    result.textContent='Aprobado anteriormente.';
    result.className='quiz-result pass';
    gate.innerHTML='<strong>¡Aprobado!</strong> Ya podés marcar el día como completado abajo.';
    gate.style.background='var(--green-soft)';
    gate.style.borderColor='var(--green)';
    submitBtn.style.display='none';
    retryBtn.style.display='';
  }

  submitBtn.addEventListener('click',correctAll);
  retryBtn.addEventListener('click',()=>{
    retryCount++;
    container.querySelectorAll('.quiz-opt').forEach(o=>{ o.classList.remove('selected','correct','incorrect','disabled'); });
    container.querySelectorAll('.quiz-feedback').forEach(fb=>{ fb.textContent=''; fb.className='quiz-feedback'; });
    container.querySelectorAll('input').forEach(i=>i.checked=false);
    if(!quizPassed(dayN)){
      result.textContent=''; result.className='quiz-result';
      submitBtn.style.display=''; retryBtn.style.display='none';
    }
  });
}

function updateCuaderno(dayN){
  const panel=document.getElementById('cuadernoBody');
  const badge=document.getElementById('cuadernoBadge');
  const sub=document.getElementById('cuadernoSub');
  if(!panel) return;
  const d=COURSE.days[dayN-1];

  if(d.sections){
    d.sections.forEach((s,i)=>{ if(isSectionDone(dayN,i) && s.insight) insights.push({section:i+1,text:s.insight}); });
  }
  if(sub) sub.textContent=`Día ${dayN} · Insights del día`;
  if(badge){ badge.textContent=insights.length; badge.style.display=insights.length>0?'inline-block':'none'; }
  if(insights.length===0){
    panel.innerHTML=`<p class="cuaderno-empty">Tu cuaderno está vacío. Avanzá por las secciones del día y los insights van apareciendo acá. Al final del día son el material para tu entregable.</p>`;

  }
}

/* Web Audio engine — sonidos procedurales */
let _ac=null;
function getAC(){
  if(!_ac && (window.AudioContext||window.webkitAudioContext)){
    try{ _ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  return _ac;
}
function tone(freq,dur,type,startGain){
  if(!fxEnabled) return;
  const ctx=getAC(); if(!ctx) return;
  type=type||'sine'; startGain=startGain||0.08;
  const osc=ctx.createOscillator(), g=ctx.createGain();
  osc.type=type; osc.frequency.value=freq;
  g.gain.setValueAtTime(startGain, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime+dur);
}

/* Confetti procedural */
function fireConfetti(){
  if(!fxEnabled) return;
  const canvas=document.createElement('canvas');
  canvas.className='confetti-canvas';
  document.body.appendChild(canvas);
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  const colors=['#F02850','#00C88C','#097bb3','#F0BE00','#8228C8','#fff'];
  const N=140, particles=[];
  const cx=window.innerWidth/2, cy=window.innerHeight*.45;
  for(let i=0;i<N;i++){
    const angle = -Math.PI/2 + (Math.random()-0.5)*Math.PI*1.2;
    const speed = 7 + Math.random()*10;
    particles.push({
      x:cx+(Math.random()-0.5)*40, y:cy,
      vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
      g:0.32+Math.random()*0.18,
      color:colors[Math.floor(Math.random()*colors.length)],
      size:5+Math.random()*5,
      rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.32,
      shape:Math.random()<0.5?'rect':'circle'
    });
  }
  let frames=0;
  function tick(){
    frames++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.rot+=p.vr;
      ctx.save();
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.color;
      if(p.shape==='rect') ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.55);
      else{ ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    });
    if(frames<200) requestAnimationFrame(tick);
    else canvas.remove();
  }
  requestAnimationFrame(tick);
}

/* ============================================================
   AUDIO MANAGER — MP3 si existe, fallback a Web Speech API
   ============================================================ */
const audioState = { current:null, currentBtn:null, type:null };
function stopAudio(){
  if(audioState.type==='file' && audioState.current){ audioState.current.pause(); audioState.current.currentTime=0; }
  else if(audioState.type==='tts'){ try{speechSynthesis.cancel();}catch(e){} }
  if(audioState.currentBtn) audioState.currentBtn.classList.remove('playing');
  audioState.current=null; audioState.currentBtn=null; audioState.type=null;
}
function getCleanText(btn){
  if(btn.dataset.audioText) return btn.dataset.audioText;
  const card=btn.closest('.sofia-line, .sofia-reflect, .prose, .lead-key');
  if(!card) return btn.parentElement?.textContent?.trim()||'';
  const clone=card.cloneNode(true);
  clone.querySelectorAll('.audio-btn, .audio-btn-inline').forEach(b=>b.remove());
  return clone.textContent.replace(/\s+/g,' ').trim();
}
function playTTS(text, btn){
  if(!text || !('speechSynthesis' in window)) return;
  try{speechSynthesis.cancel();}catch(e){}
  const utter=new SpeechSynthesisUtterance(text);
  utter.lang='es-AR'; utter.rate=1.02; utter.pitch=1;
  const voices=speechSynthesis.getVoices();
  const v = voices.find(v=>v.lang==='es-AR')
       || voices.find(v=>v.lang.startsWith('es-AR'))
       || voices.find(v=>v.lang.startsWith('es-MX'))
       || voices.find(v=>v.lang.startsWith('es-US'))
       || voices.find(v=>v.lang.startsWith('es'));
  if(v) utter.voice=v;
  utter.addEventListener('end',stopAudio);
  utter.addEventListener('error',stopAudio);
  speechSynthesis.speak(utter);
  audioState.current=utter; audioState.type='tts'; audioState.currentBtn=btn;
  btn.classList.add('playing');
}
function playFromFile(src, text, btn){
  const audio=new Audio(src);
  audio.addEventListener('ended',stopAudio);
  audio.addEventListener('error',()=>{ playTTS(text,btn); });
  audio.play().then(()=>{
    audioState.current=audio; audioState.type='file'; audioState.currentBtn=btn;
    btn.classList.add('playing');
  }).catch(()=>playTTS(text,btn));
}
document.addEventListener('click', e=>{
  const btn=e.target.closest('[data-audio]');
  if(!btn) return;
  e.preventDefault(); e.stopPropagation();
  if(audioState.currentBtn===btn){ stopAudio(); return; }
  stopAudio();
  const text=getCleanText(btn);
  const src=btn.dataset.audioSrc;
  if(src) playFromFile(src,text,btn);
  else playTTS(text,btn);
});
window.addEventListener('hashchange', stopAudio);

/* Drag & drop: clasificar cosmética vs cognitiva */
const DND_ITEMS=[
  {id:1,text:"Cada slide muestra un trofeo cuando hacés click en \"siguiente\"",cat:"cos"},
  {id:2,text:"El curso muestra un caso, pedís decidir y según la elección abre un escenario distinto con feedback",cat:"cog"},

  {id:6,text:"Una barra de XP que sube cada vez que entrás al curso, sin importar si aprendiste algo",cat:"cos"}
];

function initDnD(){
  const block=app.querySelector('[data-interactive="dnd"]');
  if(!block) return;
  const pool=block.querySelector('#dnd-pool');
  const zones=block.querySelectorAll('.dnd-zone');
  const feedback=block.querySelector('#dnd-feedback');

  /* Mezclar y renderizar items */
  const shuffled=[...DND_ITEMS].sort(()=>Math.random()-0.5);
  shuffled.forEach(item=>{
    const el=document.createElement('div');
    el.className='dnd-item';
    el.draggable=true;
    el.dataset.id=item.id;
    el.dataset.cat=item.cat;
    el.textContent=item.text;
    pool.appendChild(el);
  });

  let dragged=null;
  const items=block.querySelectorAll('.dnd-item');

  items.forEach(it=>{
    it.addEventListener('dragstart',e=>{
      dragged=it;
      it.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',it.dataset.id);
    });
    it.addEventListener('dragend',()=>{
      it.classList.remove('dragging');
      dragged=null;
    });
  });

  /* Soporte touch básico */
  items.forEach(it=>{
    let touchClone=null,startX=0,startY=0,offsetX=0,offsetY=0;
    it.addEventListener('touchstart',e=>{
      const t=e.touches[0];
      const r=it.getBoundingClientRect();
      startX=t.clientX;startY=t.clientY;
      offsetX=t.clientX-r.left;offsetY=t.clientY-r.top;
      dragged=it;
      it.classList.add('dragging');
    },{passive:true});
    it.addEventListener('touchmove',e=>{
      if(!dragged) return;
      e.preventDefault();
      const t=e.touches[0];
      if(!touchClone){
        touchClone=it.cloneNode(true);
        touchClone.style.position='fixed';
        touchClone.style.zIndex='9999';
        touchClone.style.pointerEvents='none';
        touchClone.style.width=it.offsetWidth+'px';
        touchClone.style.opacity='.85';
        document.body.appendChild(touchClone);
      }
      touchClone.style.left=(t.clientX-offsetX)+'px';
      touchClone.style.top=(t.clientY-offsetY)+'px';
      /* highlight zona */
      zones.forEach(z=>z.classList.remove('dragover'));
      const el=document.elementFromPoint(t.clientX,t.clientY);
      const z=el?el.closest('.dnd-zone'):null;
      if(z) z.classList.add('dragover');
    },{passive:false});
    it.addEventListener('touchend',e=>{
      if(!dragged) return;
      const t=e.changedTouches[0];
      const el=document.elementFromPoint(t.clientX,t.clientY);
      const z=el?el.closest('.dnd-zone'):null;
      zones.forEach(zn=>zn.classList.remove('dragover'));
      if(touchClone){ touchClone.remove(); touchClone=null; }
      it.classList.remove('dragging');
      if(z) dropItem(it,z);
      dragged=null;
    });
  });

  zones.forEach(z=>{
    z.addEventListener('dragover',e=>{
      e.preventDefault();
      z.classList.add('dragover');
    });
    z.addEventListener('dragleave',()=>z.classList.remove('dragover'));
    z.addEventListener('drop',e=>{
      e.preventDefault();
      z.classList.remove('dragover');
      if(!dragged) return;
      dropItem(dragged,z);
    });
  });

  function dropItem(item,zone){
    const correct=item.dataset.cat===zone.dataset.zone;
    if(correct){
      item.classList.remove('incorrect');
      item.classList.add('correct');
      item.draggable=false;
      zone.appendChild(item);
    } else {
      item.classList.add('incorrect');
      setTimeout(()=>item.classList.remove('incorrect'),600);
    }
    updateFeedback();
  }

  function updateFeedback(){
    const total=DND_ITEMS.length;
    const correct=block.querySelectorAll('.dnd-item.correct').length;
    if(correct===total){
      feedback.textContent='¡Listo! Los seis están bien clasificados.';
      feedback.classList.add('done');
      if(!block.querySelector('.dnd-reset')){
        const btn=document.createElement('button');
        btn.className='dnd-reset';
        btn.type='button';
        btn.textContent='Reintentar';
        btn.addEventListener('click',()=>{
          block.querySelector('.dnd-wrap').remove();
          feedback.classList.remove('done');
          feedback.textContent='Arrastrá los seis ítems para empezar.';
          btn.remove();
          /* rebuild */
          const wrap=document.createElement('div');
          wrap.className='dnd-wrap';
          wrap.innerHTML=`<div><p class="dnd-pool-label">Ejemplos por clasificar</p><div class="dnd-pool" id="dnd-pool"></div></div><div class="dnd-zones"><div class="dnd-zone cos" data-zone="cos"><p class="dnd-zone-title">Cosmética</p></div><div class="dnd-zone cog" data-zone="cog"><p class="dnd-zone-title">Cognitiva</p></div></div>`;
          feedback.parentNode.insertBefore(wrap,feedback);
          initDnD();
        });
        feedback.parentNode.insertBefore(btn,feedback.nextSibling);
      }
    } else {
      feedback.textContent=`Llevás ${correct} de ${total} bien clasificados.`;
    }
  }
}

/* Quiz bloqueante */
function initQuiz(dayN,questions){
  const container=app.querySelector('#quiz-d1');
  if(!container) return;
  const submitBtn=app.querySelector('#quiz-submit');
  const retryBtn=app.querySelector('#quiz-retry');
  const result=app.querySelector('#quiz-result');
  const gate=app.querySelector('#quiz-gate');

  const passed=quizPassed(dayN);

  container.innerHTML=questions.map((q,i)=>`
    <div class="quiz-q" data-q="${i}">
      <p class="quiz-q-text"><span class="quiz-q-num">${i+1}</span>${q.q}</p>
      <div class="quiz-options">
        ${q.opts.map((o,j)=>`
          <label class="quiz-opt" data-opt="${j}">
            <input type="radio" name="q${i}" value="${j}">
            <span>${o}</span>
          </label>
        `).join("")}
      </div>
      <div class="quiz-feedback" id="qfb-${i}"></div>
    </div>
  `).join("");

  /* Marcar selección visualmente */
  container.querySelectorAll('.quiz-opt').forEach(opt=>{
    opt.addEventListener('click',e=>{
      const q=opt.closest('.quiz-q');
      q.querySelectorAll('.quiz-opt').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
    });
  });

  if(passed){
    showResults(true);
  }

  submitBtn.addEventListener('click',()=>{
    let score=0;
    questions.forEach((q,i)=>{
      const sel=container.querySelector(`input[name="q${i}"]:checked`);
      const opts=container.querySelectorAll(`.quiz-q[data-q="${i}"] .quiz-opt`);
      const fb=container.querySelector(`#qfb-${i}`);
      opts.forEach(o=>o.classList.add('disabled'));
      if(!sel){
        fb.textContent='Sin respuesta. La correcta es: «'+q.opts[q.correct]+'». '+q.explain;
        fb.className='quiz-feedback bad show';
        opts[q.correct].classList.add('correct');
        return;
      }
      const picked=parseInt(sel.value,10);
      if(picked===q.correct){
        score++;
        opts[picked].classList.add('correct');
        fb.textContent='Correcto. '+q.explain;
        fb.className='quiz-feedback ok show';
      } else {
        opts[picked].classList.add('incorrect');
        opts[q.correct].classList.add('correct');
        fb.textContent='La correcta es: «'+q.opts[q.correct]+'». '+q.explain;
        fb.className='quiz-feedback bad show';
      }
    });
    const total=questions.length;
    const pass=score>=3;
    result.textContent=`${score} / ${total} respuestas correctas${pass?' — aprobado':''}`;
    result.className='quiz-result '+(pass?'pass':'fail');
    submitBtn.style.display='none';
    retryBtn.style.display='';
    if(pass){
      markQuizPassed(dayN);
      gate.innerHTML='<strong>¡Aprobado!</strong> Ya podés marcar el día como completado abajo.';
      gate.style.background='var(--green-soft)';
      gate.style.borderColor='var(--green)';
      /* Re-render para habilitar el botón */
      setTimeout(()=>{
        const btnComplete=app.querySelector('.daynav .btn[disabled]');
        if(btnComplete && btnComplete.textContent.includes('Marcar')){
          const newBtn=document.createElement('button');
          newBtn.className='btn btn-primary';
          newBtn.textContent='Marcar como completado';
          newBtn.dataset.complete=dayN;
          newBtn.addEventListener('click',()=>{
            state.completed.add(dayN); saveProgress(); updateTopbar(); renderDay(dayN);
          });
          btnComplete.replaceWith(newBtn);
        }
      },400);
    }
  });

  retryBtn.addEventListener('click',()=>{
    /* Reset */
    container.querySelectorAll('.quiz-opt').forEach(o=>{
      o.classList.remove('selected','correct','incorrect','disabled');
      const inp=o.querySelector('input'); if(inp) inp.checked=false;
    });
    container.querySelectorAll('.quiz-feedback').forEach(f=>{
      f.className='quiz-feedback';
      f.textContent='';
    });
    result.textContent='';
    result.className='quiz-result';
    submitBtn.style.display='';
    retryBtn.style.display='none';
  });

  function showResults(asPassed){
    /* Modo solo-lectura: mostrar correctas sin tocar nada */
    if(!asPassed) return;
    result.textContent='Quiz aprobado. Podés reintentar para repasar.';
    result.className='quiz-result pass';
    gate.innerHTML='<strong>Quiz aprobado.</strong> El botón de completar el día está habilitado abajo.';
    gate.style.background='var(--green-soft)';
    gate.style.borderColor='var(--green)';
  }
}

/* ============================================================
   INIT
   ============================================================ */
loadProfile(); loadProgress(); loadQuiz(); loadSections(); syncThemeIcon();
window.addEventListener("hashchange",route);
route(); onScroll();
</script>
</body>
